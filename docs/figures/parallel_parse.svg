<svg xmlns="http://www.w3.org/2000/svg" width="760" height="398" viewBox="0 0 760 398" role="img" aria-label="Diagram of the parallel parse: main process cuts pieces, worker pool converts them, main process writes the matrix"><style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--ring:rgba(11,11,11,0.10);--s1:#2a78d6;--s2:#eb6834;--lo:#86b6ef;--hi:#2a78d6;--ctx:#898781}
@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--grid:#2c2c2a;--axis:#383835;--ring:rgba(255,255,255,0.10);--s1:#3987e5;--s2:#d95926;--lo:#184f95;--hi:#5598e7}}
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
.card{fill:var(--surface);stroke:var(--ring)}
.title{font-size:15px;font-weight:600}
.sub,.note{font-size:12px;fill:var(--ink2)}
.lab{font-size:13px}
.small{font-size:12px}
.val{font-size:13px;fill:var(--ink2)}
.strong{font-weight:600;fill:var(--ink)}
.tick{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.grid{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--axis);stroke-width:1}
.s1{fill:var(--s1)}.s2{fill:var(--s2)}.ctx{fill:var(--ctx)}.lo{fill:var(--lo)}.hi{fill:var(--hi)}
.ring{stroke:var(--surface);stroke-width:2}
.link{stroke:var(--axis);stroke-width:2;stroke-linecap:round}
.box{fill:none;stroke:var(--axis);stroke-width:1}
.chip{fill:var(--surface);stroke:var(--axis);stroke-width:1}
.strip{fill:var(--grid);stroke:var(--axis);stroke-width:1}
.flow{stroke:var(--ink2);stroke-width:1.5;fill:none;marker-end:url(#head)}
.head{fill:var(--ink2)}
</style><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="head"/></marker></defs><rect x="0.5" y="0.5" width="759" height="397" rx="12" class="card"/><text x="24.0" y="34.0" class="title" text-anchor="start">How a large covariance block is parsed</text><text x="24.0" y="54.0" class="sub" text-anchor="start">Blocks of 64 MB or more. Smaller blocks use the 1.3 line parser.</text><rect x="24" y="76" width="150" height="176" rx="8" class="box"/><text x="36.0" y="98.0" class="lab strong" text-anchor="start">Covariance block</text><rect x="36" y="110" width="126" height="20" rx="3" class="strip"/><text x="99.0" y="124.0" class="small" text-anchor="middle">piece</text><rect x="36" y="136" width="126" height="20" rx="3" class="strip"/><text x="99.0" y="150.0" class="small" text-anchor="middle">piece</text><rect x="36" y="162" width="126" height="20" rx="3" class="strip"/><text x="99.0" y="176.0" class="small" text-anchor="middle">piece</text><rect x="36" y="188" width="126" height="20" rx="3" class="strip"/><text x="99.0" y="202.0" class="small" text-anchor="middle">...</text><text x="36.0" y="232.0" class="note" text-anchor="start">4 MB each, cut</text><text x="36.0" y="246.0" class="note" text-anchor="start">at line ends</text><rect x="196" y="76" width="168" height="176" rx="8" class="box"/><text x="208.0" y="98.0" class="lab strong" text-anchor="start">Main process</text><text x="208.0" y="120.0" class="small" text-anchor="start">Reads 4 MB ahead</text><text x="208.0" y="137.0" class="small" text-anchor="start">Cuts at the last line end</text><text x="208.0" y="154.0" class="small" text-anchor="start">Stops at the next line</text><text x="208.0" y="171.0" class="small" text-anchor="start">starting with + or -</text><text x="208.0" y="188.0" class="small" text-anchor="start">Keeps at most 8 pieces</text><text x="208.0" y="205.0" class="small" text-anchor="start">in flight</text><rect x="386" y="76" width="176" height="176" rx="8" class="box"/><text x="398.0" y="98.0" class="lab strong" text-anchor="start">Worker pool</text><rect x="398" y="110" width="152" height="24" rx="4" class="chip"/><rect x="398" y="110" width="6" height="24" rx="2" class="s2"/><text x="414.0" y="126.0" class="small" text-anchor="start">Worker 1</text><rect x="398" y="140" width="152" height="24" rx="4" class="chip"/><rect x="398" y="140" width="6" height="24" rx="2" class="s2"/><text x="414.0" y="156.0" class="small" text-anchor="start">Worker 2</text><rect x="398" y="170" width="152" height="24" rx="4" class="chip"/><rect x="398" y="170" width="6" height="24" rx="2" class="s2"/><text x="414.0" y="186.0" class="small" text-anchor="start">Worker 3</text><rect x="398" y="200" width="152" height="24" rx="4" class="chip"/><rect x="398" y="200" width="6" height="24" rx="2" class="s2"/><text x="414.0" y="216.0" class="small" text-anchor="start">Worker 4</text><text x="398.0" y="246.0" class="note" text-anchor="start">Up to 4 processes</text><rect x="584" y="76" width="152" height="176" rx="8" class="box"/><text x="596.0" y="98.0" class="lab strong" text-anchor="start">Main process</text><text x="596.0" y="120.0" class="small" text-anchor="start">Writes rows, columns</text><text x="596.0" y="137.0" class="small" text-anchor="start">and values into the</text><text x="596.0" y="154.0" class="small" text-anchor="start">n by n matrix,</text><text x="596.0" y="171.0" class="small" text-anchor="start">both triangles,</text><text x="596.0" y="188.0" class="small" text-anchor="start">in file order</text><path d="M174 164L194 164" class="flow"/><path d="M364 164L384 164" class="flow"/><path d="M562 164L582 164" class="flow"/><text x="24.0" y="284.0" class="lab strong" text-anchor="start">Inside each worker</text><rect x="24" y="296" width="124" height="44" rx="6" class="chip"/><text x="86.0" y="314.0" class="small" text-anchor="middle">Read its own</text><text x="86.0" y="330.0" class="small" text-anchor="middle">byte range</text><path d="M150 318L169 318" class="flow"/><rect x="171" y="296" width="124" height="44" rx="6" class="chip"/><text x="233.0" y="314.0" class="small" text-anchor="middle">Find lines</text><text x="233.0" y="330.0" class="small" text-anchor="middle">and tokens</text><path d="M297 318L316 318" class="flow"/><rect x="318" y="296" width="124" height="44" rx="6" class="chip"/><text x="380.0" y="314.0" class="small" text-anchor="middle">Check row and</text><text x="380.0" y="330.0" class="small" text-anchor="middle">column fields</text><path d="M444 318L463 318" class="flow"/><rect x="465" y="296" width="124" height="44" rx="6" class="chip"/><text x="527.0" y="314.0" class="small" text-anchor="middle">Convert numbers</text><text x="527.0" y="330.0" class="small" text-anchor="middle">in one call</text><path d="M591 318L610 318" class="flow"/><rect x="612" y="296" width="124" height="44" rx="6" class="chip"/><text x="674.0" y="314.0" class="small" text-anchor="middle">Return rows,</text><text x="674.0" y="330.0" class="small" text-anchor="middle">columns, values</text><text x="24.0" y="364.0" class="note" text-anchor="start">A piece with anything unusual, such as a malformed number, goes through the 1.3 line parser instead,</text><text x="24.0" y="380.0" class="note" text-anchor="start">so the result and any error message match 1.3.</text></svg>
